[metadata]
name = indra_perturbseq
version = 0.1.0
description = Config-driven INDRA pipeline for Perturb-seq source-target analysis
long_description = file: README.md
long_description_content_type = text/markdown
license = BSD-2-Clause

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    indra @ git+https://github.com/gyorilab/indra.git
    indra_cogex @ git+https://github.com/gyorilab/indra_cogex.git
    matplotlib
    networkx
    numpy
    pandas
    PyYAML
    tenacity

[options.extras_require]
single-cell =
    scanpy
bulk =
    pydeseq2
bulk-ttest =
    scipy
    statsmodels
all =
    scanpy
    pydeseq2
    scipy
    statsmodels

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    indra-perturbseq = indra_perturbseq.indra_pipeline.cli:main
    indra-ps-pipeline = indra_perturbseq.indra_pipeline.cli:main

[flake8]
max-line-length = 99
exclude =
    archive/
    .git
    __pycache__
