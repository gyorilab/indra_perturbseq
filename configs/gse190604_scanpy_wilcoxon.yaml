run:
  name: gse190604_scanpy_wilcoxon
  output_dir: outputs/indra_pipeline/gse190604_scanpy_wilcoxon

graph:
  pkl_path: /Users/prashammarfatia/Downloads/indranet_dir_graph_fix_corr_weights.pkl

input:
  kind: paired_table
  path: data/gse190604/processed_scanpy_wilcoxon/significant_source_target_pairs_scanpy_wilcoxon.csv
  columns:
    source: source_gene
    target: target_gene
    pvalue: pval_adj
    logfc: logfoldchange
    metadata:
      - perturbation_type
      - condition
      - pval
      - n_cells_perturbed
      - n_cells_control
  significance:
    threshold: 0.05
    already_significant: true

hops:
  include: [1, 2]
  stmt_types: [IncreaseAmount, DecreaseAmount, Activation, Inhibition]
  representative_statement_only: false

intermediates:
  mode: present_genes
  file: null
  column: gene

evidence:
  enabled: false
  neo4j_batch_size: 2000
  max_evidence_texts_per_statement: 20

mesh:
  terms_path: null
  batch_size: 200

plots:
  enabled: false
  include:
    - pval_histogram
    - logfc_histogram
    - logfc_vs_pval_scatter
